<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Reel Twenty</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column read top-down (header, meter, board); the guess bar is pinned to the bottom edge where the thumb lives. */
:root {
  --paper: #ECEFEA; --card: #F8F9F6; --ink: #18201C; --mute: #56625B;
  --line: #CBD3CD; --edge: #7A867F;
  --accent: #8A5300; --on-accent: #FFFFFF; --accent-soft: #F1E1C2;
  --good: #23683F; --good-soft: #D9EADF; --bad: #A61F33; --gone: #9AA49E;
  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --t-xs: 12px; --t-s: 13px; --t-m: 16px; --t-l: 22px; --t-xl: 30px;
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111613; --card: #1A211D; --ink: #E7ECE7; --mute: #98A49D; --line: #2D3631; --edge: #6B7770;
    --accent: #E9A440; --on-accent: #1A1206; --accent-soft: #3A2C16;
    --good: #62C28A; --good-soft: #1D3326; --bad: #F0707F; --gone: #4A544E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111613; --card: #1A211D; --ink: #E7ECE7; --mute: #98A49D; --line: #2D3631; --edge: #6B7770;
  --accent: #E9A440; --on-accent: #1A1206; --accent-soft: #3A2C16;
  --good: #62C28A; --good-soft: #1D3326; --bad: #F0707F; --gone: #4A544E; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font: 400 var(--t-m)/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--sp4) calc(150px + env(safe-area-inset-bottom, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp4); }

header.top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); }
.brand { font: 800 var(--t-l)/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; margin: 0; }
.brand span { color: var(--accent); }
.listbtn {
  min-height: 44px; padding: 0 var(--sp3); border: 1px solid var(--edge); border-radius: var(--r); background: transparent;
  font: 600 var(--t-s) var(--body); display: inline-flex; align-items: center; gap: var(--sp2); cursor: pointer;
}
.listbtn svg { width: 14px; height: 14px; }

.listhead { display: flex; flex-direction: column; gap: var(--sp2); }
.kicker { font: 500 var(--t-xs) var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.listhead h2 { font: 800 var(--t-xl)/1.02 var(--display); margin: 0; text-transform: uppercase; text-wrap: balance; }
.meter { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.meter i { height: 8px; border-radius: 2px; background: var(--line); }
.meter i.g { background: var(--good); } .meter i.h { background: repeating-linear-gradient(135deg, var(--good) 0 2px, var(--line) 2px 4px); } .meter i.x { background: var(--gone); }
.meter i.pop { animation: pop .55s cubic-bezier(.2,.9,.3,1.4); }
@keyframes pop { 0% { transform: scaleY(1); } 40% { transform: scaleY(2.2); } 100% { transform: scaleY(1); } }
.line { display: flex; justify-content: space-between; gap: var(--sp3); font: 600 var(--t-s) var(--body); font-variant-numeric: tabular-nums; }
.line .pts { color: var(--ink); display: inline-block; }
.line .pts.bump { animation: bump .5s ease-out; }
@keyframes bump { 30% { transform: scale(1.25); color: var(--good); } }
.legend { margin: 0; font-size: var(--t-s); color: var(--mute); }

ol.board { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row { border-bottom: 1px solid var(--line); }
.slot {
  width: 100%; min-height: 56px; display: grid; grid-template-columns: 36px 1fr auto 20px; align-items: center; gap: var(--sp3);
  background: none; border: 0; text-align: left; padding: var(--sp2) 0; cursor: pointer;
}
.rank { font: 800 var(--t-l)/1 var(--display); color: var(--mute); font-variant-numeric: tabular-nums; }
.mid { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.blank { height: 10px; border-radius: 3px; background: var(--line); width: 64%; }
.ttl { font: 700 var(--t-l)/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.01em; overflow-wrap: anywhere; }
.ttl em { font: 500 var(--t-xs) var(--mono); font-style: normal; color: var(--mute); margin-left: var(--sp1); vertical-align: 2px; }
.peek { font-size: var(--t-s); color: var(--mute); overflow-wrap: anywhere; }
.badge { font: 500 var(--t-xs) var(--mono); color: var(--mute); white-space: nowrap; }
.chev { width: 20px; height: 20px; color: var(--edge); transition: transform .2s; }
.slot[aria-expanded="true"] .chev { transform: rotate(180deg); }
.row.solved .chev, .row.lost .chev { visibility: hidden; }
.row.solved .rank { color: var(--good); }
.row.lost .rank, .row.lost .ttl { color: var(--mute); }
.row.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: var(--good-soft); } 100% { background: transparent; } }
.row.flash .ttl { animation: rise .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

.drawer { padding: 0 0 var(--sp4) 48px; display: flex; flex-direction: column; gap: var(--sp3); }
.hints { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--sp2); }
.hint {
  min-height: 48px; border: 1px solid var(--edge); background: transparent; border-radius: var(--r);
  padding: var(--sp2) var(--sp3); text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0;
}
.hint small { font: 600 var(--t-xs) var(--body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--mute); }
.hint.locked small { font-weight: 500; text-transform: none; letter-spacing: 0; }
.dnote { margin: 0; font-size: var(--t-xs); color: var(--mute); }
.hint b { font: 600 var(--t-s) var(--body); overflow-wrap: anywhere; }
.hint b { color: var(--mute); font-weight: 500; }
.hint.open { border: 1.5px solid var(--ink); background: var(--card); cursor: default; }
.hint.open b { color: var(--ink); font-weight: 600; }
.hint.locked { border-style: dashed; cursor: not-allowed; color: var(--mute); }
.textbtn { align-self: flex-start; min-height: 44px; background: none; border: 0; padding: 0; font: 600 var(--t-s) var(--body); color: var(--mute); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.result { border: 1px solid var(--edge); border-radius: var(--r); background: var(--card); padding: var(--sp4); display: flex; flex-direction: column; gap: var(--sp3); }
.result:not([hidden]) { animation: rise .5s ease-out; }
.result h3 { margin: 0; font: 800 var(--t-xl)/1 var(--display); text-transform: uppercase; }
.result p { margin: 0; color: var(--mute); font-size: var(--t-s); }
.grid { font-size: 20px; line-height: 1.15; letter-spacing: 1px; }
.acts { display: flex; gap: var(--sp2); flex-wrap: wrap; }
.btn { min-height: 48px; padding: 0 var(--sp4); border-radius: var(--r); border: 0; background: var(--accent); color: var(--on-accent); font: 600 var(--t-m) var(--body); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
.result textarea { width: 100%; font: var(--t-s)/1.4 var(--mono); background: var(--paper); color: var(--ink); border: 1px solid var(--edge); border-radius: var(--r); padding: var(--sp2); resize: none; }

footer.foot { display: flex; flex-direction: column; gap: var(--sp2); }
.actions { display: flex; gap: var(--sp4); flex-wrap: wrap; }
.actions .armed { color: var(--bad); }
.note { font-size: var(--t-xs); color: var(--mute); margin: 0; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: var(--sp2); padding-bottom: calc(var(--sp3) + env(safe-area-inset-bottom, 0px));
}
.bar .in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp1); }
.fb { min-height: 20px; font-size: var(--t-s); font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb.ok { color: var(--good); } .fb.no { color: var(--bad); } .fb.meh { color: var(--mute); }
.bar form { display: flex; gap: var(--sp2); }
.bar input {
  flex: 1; min-width: 0; height: 48px; font: 500 var(--t-m) var(--body); color: var(--ink); background: var(--card);
  border: 1px solid var(--edge); border-radius: var(--r); padding: 0 var(--sp3);
}
.bar input::placeholder { color: var(--mute); }
.tried { margin: 0; font-size: var(--t-xs); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tried s { color: var(--bad); text-decoration-thickness: 1px; }
.shake { animation: shake .32s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 12, 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 640px; max-height: 86%; overflow: auto; background: var(--paper); border-radius: 16px 16px 0 0;
  padding: var(--sp4) max(16px, env(safe-area-inset-right, 0px)) calc(var(--sp5) + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: var(--sp4);
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font: 800 var(--t-l) var(--display); text-transform: uppercase; letter-spacing: 0.04em; }
.iconbtn { width: 44px; height: 44px; margin-right: -10px; display: grid; place-items: center; background: none; border: 0; border-radius: var(--r); cursor: pointer; color: var(--ink); }
.iconbtn svg { width: 20px; height: 20px; }
.todaycard { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: var(--sp3); padding: var(--sp3) var(--sp4); border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--card); text-align: left; cursor: pointer; }
.todaycard small { display: block; font: 600 var(--t-xs) var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.todaycard b { display: block; font: 800 var(--t-xl)/1 var(--display); text-transform: uppercase; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--line); border-radius: var(--r); }
.seg button { min-height: 44px; border: 0; border-radius: 8px; background: transparent; font: 600 var(--t-s) var(--body); color: var(--mute); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.seg button span { font-weight: 500; opacity: .7; margin-left: 2px; }
.opts { list-style: none; margin: 0; padding: 0; }
.opt {
  width: 100%; min-height: 56px; display: grid; grid-template-columns: 1fr 100px; align-items: center; gap: var(--sp3);
  background: none; border: 0; border-bottom: 1px solid var(--line); padding: 0; text-align: left; cursor: pointer; font: 500 var(--t-m) var(--body);
}
.opt[aria-current="true"] { font-weight: 700; }
.opt[aria-current="true"]::after { content: "Playing"; grid-column: 1; grid-row: 2; margin-top: -10px; padding-bottom: 8px; font: 600 var(--t-xs) var(--body); color: var(--accent); }
.mm { display: grid; grid-template-columns: repeat(20, 1fr); gap: 1.5px; }
.mm i { height: 8px; border-radius: 1px; background: var(--line); }
.mm i.g { background: var(--good); } .mm i.h { background: repeating-linear-gradient(135deg, var(--good) 0 2px, var(--line) 2px 4px); } .mm i.x { background: var(--gone); }
.opt .badge { justify-self: end; }

@media (max-width: 420px) { .drawer { padding-left: 0; } .hints { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { .shake, .row.flash, .row.flash .ttl, .chev, .meter i.pop, .line .pts.bump, .result { animation: none !important; transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">Reel <span>Twenty</span></h1>
    <button class="listbtn" id="openLists" type="button" aria-haspopup="dialog">Lists
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button>
  </header>

  <section class="listhead">
    <div class="kicker" id="kick"></div>

    <div class="meter" id="meter" role="img"></div>

  </section>

  <section class="result" id="result" hidden></section>

  <ol class="board" id="board"></ol>

  <footer class="foot">
    <div class="actions">
      <button class="textbtn" id="giveAll" type="button">Reveal the rest</button>
      <button class="textbtn" id="reset" type="button">Restart list</button>
    </div>
    <p class="note">Ranked by Letterboxd average, best first. Lists, billing and ratings are hand-compiled approximations.</p>
  </footer>
</div>

<div class="bar" id="bar">
  <div class="in">
    <p class="fb meh" id="fb" aria-live="polite"></p>
    <form id="gform" autocomplete="off">
      <input id="gin" type="text" placeholder="Film title" aria-label="Guess a film" spellcheck="false" autocapitalize="off" enterkeyhint="go">
      <button class="btn" type="submit">Guess</button>
    </form>
    <p class="tried" id="tried" hidden></p>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">Lists</h2><button class="iconbtn" id="closeLists" type="button" aria-label="Close lists"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div id="groups"></div>
  </div>
</div>

  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function matches(f, guess) {
  const g = norm(guess); if (!g) return false;
  return [f.t, ...f.a].some((name) => {
    const n = norm(name); if (n === g) return true;
    const tol = n.length <= 5 ? 0 : n.length <= 10 ? 1 : 2;
    return Math.abs(n.length - g.length) <= tol && lev(n, g) <= tol;
  });
}

const blank = () => ({ s: {}, h: {}, m: [] });
function load(id) { try { const v = JSON.parse(localStorage.getItem("reel20:" + id)); return v ? { s: v.s || {}, h: v.h || {}, m: v.m || [] } : blank(); } catch (e) { return blank(); } }
function save() { try { localStorage.setItem("reel20:" + cur, JSON.stringify(state)); } catch (e) {} }

let cur = todayId(), state = load(cur), openIdx = null, armed = false, justFound = -1;
const list = () => byId[cur];
const pts = (i) => state.s[i] === "g" ? 10 - (state.h[i] || []).length : 0;
const isDone = () => list().films.every((_, i) => state.s[i]);
function cell(i) { const s = state.s[i]; return s === "g" ? ((state.h[i] || []).length ? "h" : "g") : s === "x" ? "x" : ""; }
function totals() {
  const L = list(); let found = 0, score = 0;
  L.films.forEach((_, i) => { if (state.s[i] === "g") { found++; score += pts(i); } });
  return { found, score };
}

function renderHead() {
  const L = list(), { found, score } = totals();
  $("kick").textContent = cur === todayId() ? `No. ${dayIndex() + 1} · Today's list` : "Practice list";
  $("lt").textContent = L.title;
  $("meter").innerHTML = L.films.map((_, i) => `<i class="${cell(i)}${i === justFound ? " pop" : ""}"></i>`).join("");
  $("meter").setAttribute("aria-label", `${found} of 20 found`);
  $("sFound").textContent = `${found} of 20 found`;
  $("sScore").textContent = `${score} pts`;
  $("sScore").classList.toggle("bump", justFound > -1);
}
function rowHTML(f, i) {
  const st = state.s[i], used = state.h[i] || [], done = !!st, isOpen = openIdx === i;
  const cls = "row" + (st === "g" ? " solved" : st === "x" ? " lost" : "") + (i === justFound ? " flash" : "");
  const mid = done ? `<span class="ttl">${esc(f.t)}<em>${f.y}</em></span>`
    : `<span class="blank" aria-label="Hidden film"></span>` + (used.length ? `<span class="peek">${used.map((k) => esc(hintVal(f, k))).join(" · ")}</span>` : "");
  const badge = st === "g" ? `+${10 - used.length}` : st === "x" ? "0" : used.length ? `−${used.length}` : "";
  let drawer = "";
  if (isOpen) {
    const chips = HINTS.map(([k, label]) => {
      const on = used.includes(k) || done, locked = !on && NEEDS[k] && !used.includes(NEEDS[k]);
      if (on) return `<div class="hint open"><small>${label}</small><b>${esc(hintVal(f, k))}</b></div>`;
      if (locked) return `<button class="hint locked" type="button" disabled><small>${label}</small><b>Unlocks after ${HINTS.find((h) => h[0] === NEEDS[k])[1]}</b></button>`;
      return `<button class="hint" type="button" data-i="${i}" data-k="${k}"><small>${label}</small><b>Reveal</b></button>`;
    }).join("");
    drawer = `<div class="drawer">${done ? "" : `<p class="dnote">Each hint costs 1 of this film's 10 points.</p>`}<div class="hints">${chips}</div>${done ? "" : `<button class="textbtn" type="button" data-give="${i}">Reveal the title (scores 0)</button>`}</div>`;
  }
  const chev = `<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>`;
  return `<li class="${cls}" id="row${i}"><button class="slot" type="button" data-row="${i}" aria-expanded="${isOpen}" aria-label="Film ${i + 1}${done ? ", " + esc(f.t) : ""}">
    <span class="rank">${String(i + 1).padStart(2, "0")}</span><span class="mid">${mid}</span><span class="badge">${badge}</span>${chev}</button>${drawer}</li>`;
}
function shareText() {
  const L = list(), { found, score } = totals();
  const em = { g: "🟩", h: "🟨", x: "⬛" };
  const cells = L.films.map((_, i) => em[cell(i)] || "⬜");
  const tag = cur === todayId() ? `No. ${dayIndex() + 1}` : "practice";
  return `Reel Twenty ${tag}\n${L.title}\n${found}/20 · ${score} pts\n${cells.slice(0, 10).join("")}\n${cells.slice(10).join("")}`;
}
function renderResult() {
  const R = $("result");
  if (!isDone()) { R.hidden = true; $("bar").hidden = false; return; }
  $("bar").hidden = true; R.hidden = false;
  const { found, score } = totals();
  const grade = found === 20 && score >= 180 ? "Projectionist" : found === 20 ? "Full house" : found >= 15 ? "Front row" : found >= 8 ? "Matinee crowd" : "Walked out early";
  const text = shareText(), lines = text.split("\n");
  R.innerHTML = `<h3>${grade}</h3><p>${found} of 20 found · ${score} of 200 pts</p>
    <div class="grid" aria-hidden="true">${esc(lines[3])}<br>${esc(lines[4])}</div>
    <div class="acts"><button class="btn" id="copy" type="button">Copy result</button><button class="btn ghost" id="next" type="button">Next list</button></div>
    <textarea id="shareTxt" rows="5" readonly hidden>${esc(text)}</textarea>`;
  $("copy").onclick = () => {
    const fb = () => { const t = $("shareTxt"); t.hidden = false; t.select(); $("copy").textContent = "Select and copy"; };
    try { navigator.clipboard.writeText(text).then(() => { $("copy").textContent = "Copied"; }, fb); } catch (e) { fb(); }
  };
  $("next").onclick = () => { const next = LISTS.find((l) => l.id !== cur && !load(l.id).s[0] && !Object.keys(load(l.id).s).length) || LISTS[(LISTS.indexOf(list()) + 1) % LISTS.length]; switchTo(next.id); };
}
function renderTried() {
  const t = $("tried");
  if (!state.m.length) { t.hidden = true; return; }
  t.hidden = false; t.innerHTML = "Tried: " + state.m.slice(-6).reverse().map((m) => `<s>${esc(m)}</s>`).join(" · ");
}
function render() {
  renderHead();
  $("board").innerHTML = list().films.map(rowHTML).join("");
  renderResult(); renderTried();
  justFound = -1;
}
function introFeedback() { feedback("Name any film on this list. Tap a row for hints.", "meh"); }
function feedback(msg, kind) { const fb = $("fb"); fb.textContent = msg; fb.className = "fb " + kind; }

let sheetTab = null;
const groupOf = (id) => GROUPS.findIndex((g) => g[1].includes(id));
function miniMeter(id) {
  const st = load(id);
  if (!Object.keys(st.s).length && !Object.keys(st.h).length) return `<span class="badge">New</span>`;
  return `<span class="mm" aria-hidden="true">${Array.from({ length: 20 }, (_, i) => { const v = st.s[i]; return `<i class="${v === "g" ? ((st.h[i] || []).length ? "h" : "g") : v === "x" ? "x" : ""}"></i>`; }).join("")}</span>`;
}
function renderSheet() {
  if (sheetTab === null) sheetTab = Math.max(0, groupOf(cur));
  const t = todayId(), tn = Object.values(load(t).s).filter((v) => v === "g").length;
  const found = (id) => Object.values(load(id).s).filter((v) => v === "g").length;
  $("groups").innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
    <button class="todaycard" type="button" data-list="${t}"><span><small>Today · No. ${dayIndex() + 1}</small><b>${esc(byId[t].short)}</b></span><span class="badge">${tn}/20</span></button>
    <div class="seg" role="tablist" aria-label="List categories">${GROUPS.map(([name, ids], gi) => `<button type="button" role="tab" data-tab="${gi}" aria-selected="${gi === sheetTab}">${name}<span>${ids.length}</span></button>`).join("")}</div>
    <ul class="opts" role="tabpanel">${GROUPS[sheetTab][1].map((id) => `<li><button class="opt" type="button" data-list="${id}" aria-current="${id === cur}" aria-label="${esc(byId[id].short)}, ${found(id)} of 20 found">${esc(byId[id].short)}${miniMeter(id)}</button></li>`).join("")}</ul></div>`;
}
function openSheet() { sheetTab = null; renderSheet(); $("scrim").hidden = false; $("closeLists").focus(); }
function closeSheet() { $("scrim").hidden = true; $("openLists").focus(); }
function switchTo(id) {
  cur = id; state = load(cur); openIdx = null; disarm(); closeSheet(); render();
  introFeedback(); window.scrollTo({ top: 0 });
}

$("openLists").onclick = openSheet;
$("closeLists").onclick = closeSheet;
$("scrim").addEventListener("click", (e) => {
  if (e.target === $("scrim")) return closeSheet();
  const tab = e.target.closest("[data-tab]"); if (tab) { sheetTab = +tab.dataset.tab; renderSheet(); return; }
  const o = e.target.closest("[data-list]"); if (o) switchTo(o.dataset.list);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("scrim").hidden) closeSheet(); });

$("board").addEventListener("click", (e) => {
  const hint = e.target.closest(".hint[data-k]");
  if (hint) { const i = +hint.dataset.i; (state.h[i] = state.h[i] || []).push(hint.dataset.k); save(); render(); return; }
  const give = e.target.closest("[data-give]");
  if (give) { const i = +give.dataset.give; state.s[i] = "x"; openIdx = null; save(); render(); feedback(`#${i + 1} was ${list().films[i].t}.`, "meh"); return; }
  const slot = e.target.closest(".slot");
  if (slot) { const i = +slot.dataset.row; openIdx = openIdx === i ? null : i; render(); }
});

$("gform").addEventListener("submit", (e) => {
  e.preventDefault();
  const inp = $("gin"), val = inp.value.trim(); if (!val) return;
  const L = list(), i = L.films.findIndex((f) => matches(f, val));
  const miss = (msg) => { feedback(msg, "no"); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.select(); };
  if (i === -1) {
    const key = norm(val);
    if (state.m.some((m) => norm(m) === key)) { miss(`Already tried "${val}".`); return; }
    state.m.push(val); save(); renderTried();
    const elsewhere = LISTS.find((l) => l.id !== cur && l.films.some((f) => matches(f, val)));
    miss(elsewhere ? `Not here. It's on ${elsewhere.short}.` : `"${val}" isn't on this list.`);
    return;
  }
  inp.value = "";
  if (state.s[i]) { feedback(`${L.films[i].t} is already up at #${i + 1}.`, "meh"); return; }
  state.s[i] = "g"; justFound = i; if (openIdx === i) openIdx = null; save(); render();
  const { found } = totals();
  if (isDone()) { feedback("", "meh"); try { navigator.vibrate && navigator.vibrate([20, 60, 20]); } catch (err) {} window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  feedback(`#${i + 1} ${L.films[i].t}, +${pts(i)}. ${20 - found} to go.`, "ok");
  try { navigator.vibrate && navigator.vibrate(18); } catch (err) {}
  $("row" + i).scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

function disarm() { armed = false; $("giveAll").classList.remove("armed"); $("giveAll").textContent = "Reveal the rest"; }
$("giveAll").addEventListener("click", () => {
  if (!armed) { armed = true; $("giveAll").classList.add("armed"); $("giveAll").textContent = "Tap again to reveal all"; return; }
  list().films.forEach((_, i) => { if (!state.s[i]) state.s[i] = "x"; });
  disarm(); openIdx = null; save(); render(); window.scrollTo({ top: 0 });
});
$("reset").addEventListener("click", () => { state = blank(); openIdx = null; disarm(); save(); render(); feedback("Fresh board.", "meh"); });

render(); introFeedback();
</script>

</body></html>
